[project]
name = "pyigr"
version = "2026.9.108"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [    
    'networkx'  # v3 has no deps
]
[project.optional-dependencies]
exec-dask = ['dask']
exec-daskdist = ['dask[distributed]']

[dependency-groups]
dev = [
    'fire',
    "marimo", "pyzmq",'ipdb',
    # examples
    'python-box', 'wrapt', 
]

[project.scripts]
dyrules = "state_rules:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"
